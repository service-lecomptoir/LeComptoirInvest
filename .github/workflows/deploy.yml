name: Build & Deploy (Le Comptoir Invest)

# Gardes -> build images -> push ghcr.io -> le VPS PULL.
# Secrets requis : VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY. Variable : DEPLOY_ENABLED=true.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# 🔴 NO WORKFLOW-LEVEL `concurrency` ANY MORE (owner, 28 Nov 2026, "oui pour les 11", the
# remedy of Immo 7b30d3c5). It used to cancel the whole run of an outdated push, `deploy`
# job included: on 27 Nov the same group cut Immo's deployment in the middle (run
# 46049637071) and Immo answered 502. Cancelling a run cancels EVERY job of it whose `if`
# is not still true, so no job-level setting could have protected the deployment while
# that group existed. Each job now carries its own group:
#   - the checks (`tests`) and build-push: one group per job and per branch,
#     `cancel-in-progress: true`. A newer push cancels the outdated run's copy when its
#     own starts; nothing is lost, the newer run checks everything (no paths filter here:
#     `tests` runs on every push);
#   - deploy: one group for production, `cancel-in-progress: false`. A deployment that
#     has started is never cancelled; a newer one waits for it (at most one pending: an
#     older pending deployment is replaced by the newer one, never started).

env:
  BACKEND_IMAGE: ghcr.io/service-lecomptoir/invest-backend
  FRONTEND_IMAGE: ghcr.io/service-lecomptoir/invest-frontend

jobs:
  # Les gardes tournent AVANT le build, et le build en depend. Les produits freres
  # deploient sans les passer ; ici la valeur du produit EST l'arithmetique -- ce qu'un
  # preteur est du, ce qui revient a chaque souscripteur, ce qui figure sur un releve
  # fiscal. Une erreur y est invisible : personne ne recalcule son coupon a la main.
  tests:
    # A newer push cancels this check of an outdated run (see the note on top).
    concurrency:
      group: invest-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invest_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lecomptoirinvest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invest_user -d lecomptoirinvest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Dependances
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Gardes serveur
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-a-real-key
          INVEST_TEST_PASSWORD: ci-only-password
        run: |
          python -m ruff check app tests tests_unit
          python -m ruff format --check app tests tests_unit
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Gardes interface
        working-directory: frontend
        run: |
          npm ci
          node scripts/i18n-check.mjs
          npx tsc --noEmit
          npm run lint -- --max-warnings=0
          npx vitest run

  # 🔴 NOTHING GOES ONLINE UNLESS THE CHECKS ARE GREEN, AND ONLY FROM MAIN (owner, 18 Nov
  # 2026). The gate fails when a check failed or was cancelled; it runs even then (that is
  # its job: to say so in red). `needs.*.result` reads EVERY job listed in `needs`: a check
  # added there is gated without touching the script.
  checks:
    needs: [tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      # A check CANCELLED BY A NEWER PUSH (its job-level group, see the note on top) is not
      # a red: the branch has moved on, the newer run checks it all again, and this outdated
      # commit is neither built nor deployed (`go` false, the run ends green with build-push
      # and deploy skipped). A check cancelled while the commit is still the head of the
      # branch (a time limit) stays red.
      - name: Every check is green or skipped on purpose
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: tests=${{ needs.tests.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$RESULTS"
          if [ "$FAILED" != "false" ]; then
            echo "A check failed: nothing is built nor deployed."
            exit 1
          fi
          if [ "$CANCELLED" != "false" ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF" --jq .sha 2>/dev/null) || head=""
            if printf '%s' "$head" | grep -Eq '^[0-9a-f]{40}$' && [ "$head" != "$GITHUB_SHA" ]; then
              echo "A check was cancelled by a newer push ($head): this outdated commit is neither built nor deployed, the newer run checks it."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "A check was cancelled while this commit is still the head of $GITHUB_REF (time limit?): nothing is built nor deployed."
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  build-push:
    needs: checks
    # Only main goes online: a manual run (workflow_dispatch) on another branch checks,
    # and stops here. `!cancelled()` and the gate's result, not the implicit success().
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.go == 'true'
      && github.ref == 'refs/heads/main' }}
    # A newer push's build cancels this one: nothing of an outdated commit is online yet.
    concurrency:
      group: invest-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # No VITE_API_URL: the bundle calls its API on the RELATIVE path `/api`, on the
          # host that served the page (the edge routes /api/ of every name to the backend).
          # An absolute address baked in here tied the interface to ONE domain: served
          # under another name, every call became cross-origin and was refused (2 Oct 2026).
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only main goes online, as for build-push.
    if: >-
      ${{ !cancelled() && needs.build-push.result == 'success'
      && vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    # 🔴 NEVER CANCELLED ONCE STARTED (owner, 28 Nov 2026; Immo's run 46049637071 was
    # cancelled in the middle of its deployment on 27 Nov and Immo answered 502). One group
    # for production, whatever the run: a newer deployment waits for this one to end.
    # `cancel-in-progress: false` only lets GitHub replace an older deployment still
    # PENDING (never started) by the newer one.
    concurrency:
      group: invest-deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      actions: read         # « Pas derriere un deploiement plus recent » lit les runs
    steps:
      # Runs are no longer cancelled as a whole, so an outdated run whose checks ended
      # late could reach this job AFTER a newer run has deployed, and put the older
      # version back online. The group above orders deployments, not commits: this step
      # does. It reads the latest run of main whose deployment went through; when that run
      # is newer than this one, this deployment stops here, green, without touching the
      # server. If the API is silent, the deployment goes on (this commit passed every
      # check; the group keeps it alone).
      - name: Pas derriere un deploiement plus recent
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=""
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs[] | .id' 2>/dev/null) || runs=""
          for id in $runs; do
            step=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == "deploy") | .steps[]? | select(.name == "Pull & up sur le VPS") | .conclusion' 2>/dev/null) || step=""
            if [ "$step" = "success" ]; then last="$id"; break; fi
          done
          if [ -n "$last" ] && [ "$last" -gt "$GITHUB_RUN_ID" ]; then
            echo "Run $last, newer than this one, has already deployed: this outdated commit is not deployed."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last deployment: run ${last:-unknown}. This run ($GITHUB_RUN_ID) deploys."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.order.outputs.go == 'true' }}
      # Preuve que le compose du VPS est bien celui du depot. Un televersement peut
      # « reussir » sans que le fichier attendu soit arrive : on compare les empreintes
      # des deux cotes plutot que de le supposer.
      - name: Empreinte des composes du depot
        if: ${{ steps.order.outputs.go == 'true' }}
        id: composes
        run: echo "sha=$(sha256sum docker/docker-compose.deploy.yml docker/docker-compose.prod.yml | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Copier les composes
        if: ${{ steps.order.outputs.go == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Liste separee par des virgules et non un bloc multi-ligne : le bloc laisse une
          # ligne vide finale, que l'action prend pour un chemin vide et rejette.
          source: "docker/docker-compose.deploy.yml,docker/docker-compose.prod.yml"
          target: ~/LeComptoirInvest

      # ⚠️ This step's name is read by « Pas derriere un deploiement plus recent »
      # (the API marks the last deployment by it): rename both together.
      - name: Pull & up sur le VPS
        if: ${{ steps.order.outputs.go == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_SHA: ${{ steps.composes.outputs.sha }}
        with:
          envs: COMPOSE_SHA
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/LeComptoirInvest
            actual=$(sha256sum docker/docker-compose.deploy.yml docker/docker-compose.prod.yml | sha256sum | cut -d' ' -f1)
            if [ "$actual" != "$COMPOSE_SHA" ]; then
              echo "ECHEC : compose du VPS different du depot (attendu $COMPOSE_SHA, trouve $actual)"
              exit 1
            fi
            export IMAGE_TAG=${{ github.sha }}
            COMPOSE="docker compose -p invest -f docker/docker-compose.deploy.yml"
            # ghcr met parfois quelques minutes a propager les droits du tag fraichement
            # pousse (403). `</dev/null` est indispensable : sans lui, `docker compose pull`
            # avale le reste du script envoye sur stdin et le retry n'est jamais execute.
            pulled=0; i=1; while [ "$i" -le 8 ]; do echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null 2>&1 || true; $COMPOSE pull invest-backend invest-frontend </dev/null && pulled=1 || pulled=0; if [ "$pulled" = 1 ]; then break; fi; echo "ghcr pas pret, tentative $i/8 ; retry dans 30s"; sleep 30; i=$((i+1)); done; if [ "$pulled" != 1 ]; then echo "pull KO apres 8 essais (~4 min)"; exit 1; fi
            # `--pull never` : `--force-recreate` refait sinon un pull implicite, deuxieme
            # source de 403 alors que l'image est deja locale.
            $COMPOSE up -d --force-recreate --no-deps --pull never invest-backend invest-frontend </dev/null
            running=$(docker inspect invest_backend --format '{{.Config.Image}}')
            case "$running" in *"${IMAGE_TAG}"*) echo "OK deploiement : $running" ;; *) echo "ECHEC : conteneur sur $running au lieu de ${IMAGE_TAG}"; exit 1 ;; esac
            # 🔴 LE NETTOYAGE NE DOIT PAS FAIRE ECHOUER UNE LIVRAISON DEJA FAITE.
            # Il tourne APRES la verification du conteneur : a ce point le deploiement
            # a reussi. Deux depots pousses coup sur coup se sont retrouves a elaguer
            # en meme temps, Docker a repondu « a prune operation is already running »,
            # et `-e` a transforme un menage rate en deploiement rouge -- en sautant au
            # passage le `docker logout` qui suit. Un run vert qui ment sur un echec est
            # grave ; un run rouge qui ment sur une reussite l est tout autant.
            docker image prune -af --filter "until=72h" || echo "menage des images saute (elagage concurrent) : sans effet sur le deploiement"
            docker logout ghcr.io
            echo "Deploye : $IMAGE_TAG"
