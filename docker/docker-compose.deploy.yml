# ── Déploiement par IMAGES — Le Comptoir Invest ───────────────────────────────
# Le CI construit et pousse les images sur ghcr.io ; le VPS ne fait que tirer.
#   export IMAGE_TAG=<sha>
#   docker compose -p invest -f docker/docker-compose.deploy.yml pull
#   docker compose -p invest -f docker/docker-compose.deploy.yml up -d
#
# ⚠️ PROJET COMPOSE `invest`, JAMAIS `docker`. Le préfixe du projet nomme les volumes :
# déployer sous un autre projet monterait un volume VIDE et la base aurait l'air perdue.
# C'est arrivé sur Alice et Séjour, et ça ne se voit qu'une fois le conteneur démarré.
#
# 🔴 CE PRODUIT A SA PROPRE BASE, ici comme en local. Le registre des investisseurs et les
# mouvements bancaires du fonds ne partagent ni sauvegarde, ni restauration, ni export
# mal cadré avec un outil de gestion locative.

services:
  invest-db:
    image: postgres:16-alpine
    container_name: invest_db
    restart: always
    env_file:
      - ../backend/.env.prod
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - invest_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared

  invest-backend:
    image: ghcr.io/service-lecomptoir/invest-backend:${IMAGE_TAG:?IMAGE_TAG manquant. Le VPS ne tire que par SHA de commit, il n a donc aucune image latest en local : sans cette variable la recreation vise une AUTRE image que celle qui tourne. Utiliser le tag du conteneur en service, par exemple IMAGE_TAG=$(docker inspect <conteneur> --format '{{.Config.Image}}' | sed 's/.*://')}
    pull_policy: always
    container_name: invest_backend
    restart: always
    env_file:
      # 🔴 Connexion SMTP MUTUALISEE (~/shared/smtp.env sur le VPS). Invest etait le
      # QUATRIEME produit et le seul absent de ce magasin : quand il a ete cree, ce
      # produit n'avait pas de messagerie du tout. Y recopier les identifiants aurait
      # ramene exactement le geste que le magasin a supprime, celui d'editer quatre
      # .env.prod a la main a chaque rotation.
      # `required: false` : un poste de developpement n'a pas ce fichier, et son absence
      # ne doit pas empecher de lire ce compose.
      # Place AVANT le .env.prod du produit : ce qui suit l'emporte, donc l'identite
      # d'expedition (SMTP_FROM_EMAIL, SMTP_FROM_NAME) reste celle d'Invest, et une
      # surcharge locale reste possible en cas d'incident.
      - path: ../../shared/smtp.env
        required: false
      - ../backend/.env.prod
    environment:
      ENV: production
      DEBUG: "false"
    depends_on:
      invest-db:
        condition: service_healthy
    expose:
      - "8001"
    networks:
      - shared

  invest-frontend:
    image: ghcr.io/service-lecomptoir/invest-frontend:${IMAGE_TAG:?IMAGE_TAG manquant. Le VPS ne tire que par SHA de commit, il n a donc aucune image latest en local : sans cette variable la recreation vise une AUTRE image que celle qui tourne. Utiliser le tag du conteneur en service, par exemple IMAGE_TAG=$(docker inspect <conteneur> --format '{{.Config.Image}}' | sed 's/.*://')}
    pull_policy: always
    container_name: invest_frontend
    restart: always
    depends_on:
      - invest-backend
    expose:
      - "80"
    networks:
      - shared

volumes:
  invest_pgdata:

networks:
  shared:
    external: true
    name: lecomptoir_net
